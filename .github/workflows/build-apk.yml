name: Build Android APK

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Grant execute permission for gradlew
      run: chmod +x gradlew

    - name: Export Room schemas before tests
      run: ./gradlew kspFossDebugKotlin

    - name: Run unit tests before packaging
      run: ./gradlew testFossDebugUnitTest testPlayDebugUnitTest

    - name: Upload generated Room schema 71 for inspection
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: room-schema-71
        path: app/schemas/com.chmouel.liseur.data.db.LiseurDatabase/71.json
        if-no-files-found: warn

    - name: Build Debug APK
      run: ./gradlew assembleDebug

    - name: Upload APK artifact
      uses: actions/upload-artifact@v4
      with:
        name: app-debug-apk
        path: app/build/outputs/apk/**/*.apk
