name: Build Android APK

on:
  push:
    branches: [ main, master, 'release/**', 'fix/**', 'feat/**' ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Grant execute permission for gradlew
      run: chmod +x gradlew

    - name: Run unit tests before packaging
      run: ./gradlew testFossDebugUnitTest testPlayDebugUnitTest

    - name: Build normal FOSS APK
      run: ./gradlew assembleFossDebug

    - name: Name APK for this workflow run
      run: cp app/build/outputs/apk/foss/debug/app-foss-debug.apk "Papa-Liseur-Reader#${{ github.run_number }}.apk"

    - name: Upload FOSS APK artifact
      uses: actions/upload-artifact@v4
      with:
        name: Papa-Liseur-Reader#${{ github.run_number }}
        path: Papa-Liseur-Reader#${{ github.run_number }}.apk
