name: Build Android APK

permissions:
  contents: write

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Grant execute permission for gradlew
      run: chmod +x gradlew

    - name: Export Room schemas before tests
      run: ./gradlew kspFossDebugKotlin

    - name: Commit Room-exported schema 71
      if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        git config user.name "github-actions[bot]"
        git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
        git add app/schemas/com.chmouel.liseur.data.db.LiseurDatabase/71.json
        if ! git diff --cached --quiet; then
          git commit -m "db: export Room schema 71"
          git push origin "HEAD:${GITHUB_HEAD_REF}"
        fi

    - name: Upload generated Room schema 71 for inspection
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: room-schema-71
        path: app/schemas/com.chmouel.liseur.data.db.LiseurDatabase/71.json
        if-no-files-found: warn

    - name: Run unit tests before packaging
      run: ./gradlew testFossDebugUnitTest testPlayDebugUnitTest

    - name: Build Debug APK
      run: ./gradlew assembleDebug

    - name: Upload APK artifact
      uses: actions/upload-artifact@v4
      with:
        name: app-debug-apk
        path: app/build/outputs/apk/**/*.apk
