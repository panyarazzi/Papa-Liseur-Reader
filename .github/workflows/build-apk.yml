name: Build Android APK

on:
  push:
    branches: [ main, master, 'release/**', 'fix/**', 'feat/**' ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Grant execute permission for gradlew
      run: chmod +x gradlew

    - name: Run unit tests before packaging
      run: ./gradlew testFossDebugUnitTest testPlayDebugUnitTest

    - name: Build FOSS side-by-side test APK
      run: ./gradlew assembleFossDev

    - name: Rename FOSS test APK with workflow run number
      shell: bash
      run: |
        source_apk="app/build/outputs/apk/foss/dev/app-foss-dev.apk"
        target_apk="app/build/outputs/apk/foss/dev/Papa-Liseur-Reader#${GITHUB_RUN_NUMBER}.apk"
        test -f "$source_apk"
        cp "$source_apk" "$target_apk"
        echo "APK_FILE=$target_apk" >> "$GITHUB_ENV"

    - name: Upload FOSS test APK
      uses: actions/upload-artifact@v4
      with:
        name: Papa-Liseur-Reader-${{ github.run_number }}
        path: ${{ env.APK_FILE }}
        if-no-files-found: error
